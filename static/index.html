<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قنوات</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>قنوات</h1>
      <div class="upload-bar">
        <label for="file-input" class="btn">رفع ملف M3U</label>
        <input type="file" id="file-input" accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl">
        <button type="button" id="toggle-url" class="btn btn-ghost">من رابط</button>
      </div>
      <form class="url-form" id="url-form" hidden>
        <input type="url" id="url-input" placeholder="https://example.com/list.m3u" required>
        <button type="submit" class="btn">جلب</button>
      </form>
      <div id="upload-status" aria-live="polite"></div>
      <input id="search" type="search" placeholder="ابحث عن قناة…" aria-label="بحث">
    </header>
    <nav id="groups" aria-label="التصنيفات"></nav>
    <ul id="channels" aria-label="قائمة القنوات"></ul>
  </aside>
  <main>
    <div id="player-wrap">
      <video id="player" controls autoplay playsinline></video>
      <div id="now-playing" aria-live="polite">اختر قناة من القائمة للبدء</div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
